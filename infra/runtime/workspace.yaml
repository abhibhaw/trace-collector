apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: work, namespace: experiments}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: azurefile-csi-premium
  resources: {requests: {storage: 100Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: toolbox, namespace: experiments}
spec:
  replicas: 1
  selector: {matchLabels: {app: toolbox}}
  template:
    metadata: {labels: {app: toolbox}}
    spec:
      nodeSelector: {peira.tech/pool: experiments}
      tolerations: [{key: peira.tech/experiments, operator: Equal, value: "true", effect: NoSchedule}]
      containers:
      - name: toolbox
        image: ghcr.io/astral-sh/uv:0.9.9-python3.12-bookworm-slim
        command: [sleep, infinity]
        env:
        - {name: UV_CACHE_DIR, value: /cache/uv}
        - {name: UV_PYTHON_PREFERENCE, value: only-system}
        - {name: UV_LINK_MODE, value: copy}
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {memory: 6Gi}
        volumeMounts:
        - {name: work, mountPath: /work}
        - {name: cache, mountPath: /cache}
      volumes:
      - name: work
        persistentVolumeClaim: {claimName: work}
      - name: cache
        emptyDir: {sizeLimit: 30Gi}
