# LiteLLM proxy config. Source of ConfigMap `litellm-config`. No secrets here.
# Secrets come from env: ANTHROPIC_API_KEY (llm-keys), LITELLM_MASTER_KEY and DATABASE_URL (litellm-secrets).
#
# rpm/tpm are enforced per replica (no Redis). With 2 replicas the effective
# totals are: haiku 400 rpm, sonnet 100 rpm.
model_list:
  - model_name: claude-haiku-5-5
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 200
      tpm: 1000000
      # Model returns 400 on non-default sampling params. Strip them on every route.
      additional_drop_params: ["temperature", "top_p", "top_k"]
    model_info:
      input_cost_per_token: 1.0e-07     # 0.10 USD / 1M
      output_cost_per_token: 5.0e-07    # 0.50 USD / 1M
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      rpm: 50
      tpm: 400000
      additional_drop_params: ["temperature", "top_p", "top_k"]
    model_info:
      input_cost_per_token: 2.0e-06     # 2.00 USD / 1M
      output_cost_per_token: 1.0e-05    # 10.00 USD / 1M
      cache_read_input_token_cost: 2.0e-07  # 0.20 USD / 1M

litellm_settings:
  drop_params: true
  max_budget: 300           # proxy-wide guard, stored in DB (litellm_proxy_budget)
  budget_duration: 365d     # LiteLLM requires a duration with max_budget; 1 year = no reset during the project
  num_retries: 3
  request_timeout: 600
  # No logging callbacks. Agents trace themselves.
  callbacks: []
  success_callback: []
  failure_callback: []
  turn_off_message_logging: true

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 600
  retry_after: 2            # minimum backoff seconds; LiteLLM also honors retry-after headers
  disable_cooldowns: true   # one deployment per model; a cooldown would fail all requests
  retry_policy:
    RateLimitErrorRetries: 3          # 429
    InternalServerErrorRetries: 3     # 500 / 529 overloaded
    ServiceUnavailableErrorRetries: 3
    TimeoutErrorRetries: 1
    BadRequestErrorRetries: 0
    AuthenticationErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  disable_spend_logs: false
  store_prompts_in_spend_logs: false
  proxy_batch_write_at: 10
  database_connection_pool_limit: 20
